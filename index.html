<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NGS Arbejdsseddel">
  <title>NGS Arbejdsregistrering</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" href="icon-192.png">
  <style>
    :root {
      --ngs-yellow: #f4b400;
      --ngs-yellow-dark: #d99e00;
      --white: #fff;
      --black: #111;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; margin: 0; }

    body {
      min-height: 100svh;
      color: var(--white);
      background: #111;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .app {
      position: relative;
      display: flex;
      min-height: 100svh;
      overflow: hidden;
      isolation: isolate;
    }

    .app::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      background:
        url("holdbillede.jpg") center 38% / cover no-repeat;
      transform: scale(1.01);
    }

    .app::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background:
        linear-gradient(180deg, rgba(0,0,0,.62) 0%, rgba(0,0,0,.35) 40%, rgba(0,0,0,.82) 100%);
    }

    .language {
      position: fixed;
      top: max(16px, env(safe-area-inset-top));
      right: 16px;
      z-index: 3;
      min-width: 92px;
      min-height: 48px;
      padding: 10px 16px;
      border: 2px solid rgba(255,255,255,.8);
      border-radius: 999px;
      color: #fff;
      background: rgba(0,0,0,.5);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }

    main {
      width: min(720px, 100%);
      margin: auto;
      padding:
        max(84px, calc(env(safe-area-inset-top) + 70px))
        20px
        max(118px, calc(env(safe-area-inset-bottom) + 100px));
      text-align: center;
    }

    .logo {
      width: min(280px, 74vw);
      height: auto;
      margin-bottom: 24px;
      filter: drop-shadow(0 3px 16px rgba(0,0,0,.8));
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 10vw, 4.2rem);
      line-height: .95;
      letter-spacing: -.045em;
      text-transform: uppercase;
      text-shadow: 0 3px 20px rgba(0,0,0,.9);
    }

    .intro {
      max-width: 540px;
      margin: 20px auto 0;
      font-size: clamp(1.05rem, 4.3vw, 1.35rem);
      font-weight: 700;
      line-height: 1.4;
      text-shadow: 0 2px 12px rgba(0,0,0,1);
    }

    .open-form {
      position: fixed;
      right: 16px;
      bottom: max(16px, env(safe-area-inset-bottom));
      left: 16px;
      z-index: 4;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 72px;
      padding: 18px 22px;
      border: 0;
      border-radius: 18px;
      color: var(--black);
      background: var(--ngs-yellow);
      box-shadow: 0 8px 28px rgba(0,0,0,.45);
      font-size: clamp(1.15rem, 5.5vw, 1.6rem);
      font-weight: 950;
      letter-spacing: .01em;
      text-decoration: none;
      text-transform: uppercase;
      touch-action: manipulation;
    }

    .open-form:active {
      transform: translateY(2px);
      background: var(--ngs-yellow-dark);
    }

    @media (min-width: 760px) {
      .open-form {
        right: 50%;
        left: auto;
        width: min(640px, calc(100vw - 32px));
        transform: translateX(50%);
      }

      .open-form:active {
        transform: translateX(50%) translateY(2px);
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <button class="language" id="languageButton" type="button" aria-label="Skift sprog">Polski</button>

    <main>
      <img class="logo" src="ngs-logo.png" alt="Næstved Gulvspecialist">
      <h1 data-da="Arbejdsregistrering" data-pl="Rejestracja pracy">Arbejdsregistrering</h1>
      <p class="intro"
         data-da="Udfyld dagens arbejdsseddel, når arbejdet er afsluttet."
         data-pl="Wypełnij dzienną kartę pracy po zakończeniu pracy.">
         Udfyld dagens arbejdsseddel, når arbejdet er afsluttet.
      </p>
    </main>

    <a class="open-form"
       id="formButton"
       href="https://docs.google.com/forms/d/e/1FAIpQLScOPCvHpaeIZ0VmZU5WFSN6gtL8Fds6oZPYTymFggdWegRXMg/viewform?usp=header"
       data-da="Åbn arbejdsseddel"
       data-pl="Otwórz kartę pracy">
       Åbn arbejdsseddel
    </a>
  </div>

  <script>
    const languageButton = document.getElementById("languageButton");
    let language = localStorage.getItem("ngs-language") === "pl" ? "pl" : "da";

    function setLanguage(nextLanguage) {
      language = nextLanguage;
      document.documentElement.lang = language;
      document.querySelectorAll("[data-da][data-pl]").forEach((element) => {
        element.textContent = element.dataset[language];
      });
      languageButton.textContent = language === "da" ? "Polski" : "Dansk";
      languageButton.setAttribute(
        "aria-label",
        language === "da" ? "Skift til polsk" : "Zmień język na duński"
      );
      localStorage.setItem("ngs-language", language);
    }

    languageButton.addEventListener("click", () => {
      setLanguage(language === "da" ? "pl" : "da");
    });

    setLanguage(language);

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("service-worker.js"));
    }
  </script>
</body>
</html>
